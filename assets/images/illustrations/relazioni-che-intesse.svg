    <circle cx="523" cy="420" r="7"/>
    <circle cx="258" cy="586" r="7"/>
  </g>

  <g fill="#FFF8EE" stroke="#234B44" stroke-width="4">
    <circle cx="142" cy="164" r="54"/>
    <circle cx="570" cy="262" r="56"/>
    <circle cx="116" cy="522" r="48"/>
    <circle cx="450" cy="580" r="58"/>
